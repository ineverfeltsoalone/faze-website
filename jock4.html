<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAZE | Ocean Fade</title>

<style>

body{
margin:0;
font-family:'Gill Sans', sans-serif;

background:linear-gradient(rgba(0,0,0,0.9), rgba(0,20,30,0.8)),
url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e");

background-size:cover;
background-position:center;
background-attachment:fixed;
color:white;

display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.box{
max-width:800px;
background:rgba(15,25,30,0.6);
backdrop-filter:blur(15px);
padding:30px;
border-radius:20px;
text-align:center;
border:1px solid rgba(255,255,255,0.08);
}

.slider{position:relative;}

.slider img{
width:100%;
max-height:450px;
object-fit:cover;
border-radius:15px;
}

.arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
font-size:28px;
background:rgba(0,0,0,0.4);
border:none;
color:white;
padding:10px 14px;
cursor:pointer;
border-radius:10px;
}

.left{left:10px;}
.right{right:10px;}

h1{margin:20px 0 10px;}
.price{opacity:0.8;font-size:20px;}
.info{margin-top:20px;line-height:1.6;opacity:0.9;}

a{
display:inline-block;
margin-top:20px;
padding:12px 18px;
background:rgba(255,255,255,0.08);
color:white;
text-decoration:none;
border-radius:12px;
}

</style>

</head>

<body>

<div class="box">

<div class="slider">
<img id="img" src="images/jock4_1.jpg">

<button class="arrow left" onclick="prev()">‹</button>
<button class="arrow right" onclick="next()">›</button>
</div>

<h1>Ocean Fade</h1>
<p class="price">$41.99</p>

<p class="info">
FAZE jockings 🩳<br>
Ocean fade premium streetwear.<br><br>

📸 @fazedesigned<br>
📞 0560648026
</p>

<a href="jockings.html">← Back to Jockings</a>

</div>

<script>

let images = [
"images/jock4_1.jpg",
"images/jock4_2.jpg",
"images/jock4_3.jpg"
];

let index = 0;

function show(){
document.getElementById("img").src = images[index];
}

function next(){
index++;
if(index > 2){index = 0;}
show();
}

function prev(){
index--;
if(index < 0){index = 2;}
show();
}

</script>

</body>
</html>
