<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAZE | Phone Cases</title>

<style>

body{
margin:0;
font-family:'Gill Sans', sans-serif;

background:linear-gradient(rgba(0,0,0,0.88), rgba(0,20,30,0.75)),
url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e");

background-size:cover;
background-position:center;
background-attachment:fixed;
color:white;
}

/* header */
header{
text-align:center;
padding:60px 20px 20px;
}

h1{
font-size:48px;
margin:0;
letter-spacing:2px;
}

p{
opacity:0.8;
}

/* grid */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
gap:20px;
padding:40px;
max-width:1100px;
margin:auto;
}

/* cards */
.card{
background:rgba(15,25,30,0.55);
backdrop-filter:blur(12px);
border-radius:20px;
overflow:hidden;
border:1px solid rgba(255,255,255,0.08);
transition:0.3s;
}

.card:hover{
transform:scale(1.03);
}

.card img{
width:100%;
height:240px;
object-fit:cover;
}

/* content */
.card-content{
padding:15px;
}

/* button */
a{
display:block;
margin-top:10px;
padding:10px;
text-align:center;
background:rgba(255,255,255,0.08);
color:white;
text-decoration:none;
border-radius:12px;
transition:0.3s;
}

a:hover{
background:rgba(255,255,255,0.15);
}

/* home button */
.home{
text-align:center;
padding:20px;
}

.home a{
display:inline-block;
padding:12px 18px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.12);
border-radius:12px;
text-decoration:none;
color:white;
}

</style>

</head>

<body>

<header>
<h1>FAZE Phone Cases</h1>
<p>Minimal luxury protection 📱</p>
</header>
